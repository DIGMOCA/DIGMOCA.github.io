<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DIGMOCA ARCHIVE</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="site-header"></div>

<main>

  <h2>WORKS</h2>


  <!-- ジャンル選択 -->

  <div class="filters">

    <button class="filter-button active" data-filter="all">
      ALL
    </button>

    <button class="filter-button" data-filter="douga">
      VIDEO
    </button>

    <button class="filter-button" data-filter="illustration">
      ILLUSTRATION
    </button>

    <button class="filter-button" data-filter="game">
      GAME
    </button>

    <button class="filter-button" data-filter="manga">
      MANGA
    </button>

    <button class="filter-button" data-filter="ongaku">
      MUSIC
    </button>

    <button class="filter-button" data-filter="3dcg">
      3DCG
    </button>

    <button class="filter-button" data-filter="animation">
      ANIMATION
    </button>

  </div>


  <!-- 作品一覧 -->

  <section
    class="works"
    id="works-list"
  >
  </section>

</main>

<div id="site-footer"></div>
  
<script src="header.js"></script>
<script src="footer.js"></script>
<script src="works-data.js"></script>
<script src="works.js"></script>
<script src="analytics.js"></script>
  
</body>

</html>
