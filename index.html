<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>DIGMOCA ARCHIVE</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <h1>
    DIGMOCA ARCHIVE
  </h1>

  <nav>
    <a href="index.html">WORKS</a>
    <a href="years.html">YEARS</a>
    <a href="about.html">ABOUT</a>
    <a href="https://lit.link/digmoca">SNS</a>
  </nav>

</header>


<main>

  <h2>WORKS</h2>


  <!-- ジャンル選択 -->

  <div class="filters">

    <button class="filter-button active" data-filter="all">
      ALL
    </button>

    <button class="filter-button" data-filter="douga">
      DOUGA
    </button>

    <button class="filter-button" data-filter="illustration">
      ILLUSTRATION
    </button>

    <button class="filter-button" data-filter="game">
      GAME
    </button>

    <button class="filter-button" data-filter="manga">
      MANGA
    </button>

    <button class="filter-button" data-filter="ongaku">
      ONGAKU
    </button>

    <button class="filter-button" data-filter="3dcg">
      3DCG
    </button>

    <button class="filter-button" data-filter="animation">
      ANIMATION
    </button>

  </div>


  <!-- 作品一覧 -->

  <section class="works">

    <article
      class="work"
      data-category="illustration"
    >

      <a href="works/musyokutoumei3_5.html">

        <img
          src="images/musyokutoumei3_5.jpg"
          alt="無色透名美術館"
          loading="lazy"
        >

      </a>

      <h3>

        <a href="works/musyokutoumei3_5.html">
          【無色透名美術館】ひ　い　　て　　　い　　　　く　　　　　　。
        </a>

      </h3>

      <p>
        2026 / ILLUSTRATION
      </p>

    </article>


  </section>

</main>


<footer>
  <p>© DIGMOCA All Rights Reserved</p>
</footer>


<script>

const buttons =
  document.querySelectorAll(".filter-button");

const works =
  document.querySelectorAll(".work");


buttons.forEach(button => {

  button.addEventListener("click", () => {

    const filter =
      button.dataset.filter;


    buttons.forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");


    works.forEach(work => {

      const categories =
        work.dataset.category.split(" ");

      if (
        filter === "all" ||
        categories.includes(filter)
      ) {

        work.hidden = false;

      } else {

        work.hidden = true;

      }

    });

  });

});

</script>

</body>

</html>
